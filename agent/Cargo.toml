[package]
name = "aegisec-agent"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "aegisec-agent"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client with TLS
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Unique IDs and time
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# System info
hostname = "0.4"
procfs = "0.16"

# Unix syscalls: signals, inotify, netlink sockets
nix = { version = "0.29", features = ["process", "signal", "fs", "user", "inotify"] }
libc = "0.2"

# Error handling + logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrent data structures
dashmap = "6"
crossbeam-channel = "0.5"

# Config file support
serde_yaml = "0.9"
